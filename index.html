<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>Steel Fox | Premium Streetwear Clothing</title>

    <meta
      name="description"
      content="Steel Fox — premium streetwear built for those who refuse to blend in. Shop oversized, graphic and everyday streetwear."
    />

    <meta
      name="keywords"
      content="Steel Fox, Steel Fox clothing, streetwear, oversized t shirts, graphic t shirts, premium streetwear, men's fashion"
    />

    <meta name="author" content="Steel Fox" />

    <!-- Search Engine -->
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#050505" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Steel Fox | Premium Streetwear" />
    <meta
      property="og:description"
      content="Premium streetwear for those who refuse to blend in."
    />
    <meta property="og:site_name" content="Steel Fox" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Steel Fox | Premium Streetwear" />
    <meta
      name="twitter:description"
      content="Premium streetwear for those who refuse to blend in."
    />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
